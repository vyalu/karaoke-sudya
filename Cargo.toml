[package]
name = "karaoke"
version = "1.1.0"
edition = "2021"

[dependencies]
cpal = "0.15.3"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "flac", "aac", "isomp4", "wav", "pcm"] }
rustfft = "6.2"
serde_json = "1"
nnnoiseless = { version = "0.5", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
wry = "0.57"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
